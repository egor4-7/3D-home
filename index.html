<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D-home — Проект дома №346-1</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            background: #111; 
            color: #fff; 
        }
        #info {
            position: absolute; top: 12px; left: 12px; z-index: 10;
            background: rgba(20, 20, 20, 0.9); padding: 10px 14px; border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.15); font-size: 13px;
        }
        #info h3 { margin: 0 0 4px 0; font-size: 15px; color: #4CAF50; }
        #info p { margin: 0; color: #bbb; }
    </style>
    <!-- Встроенная стабильная библиотека Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <div id="info">
        <h3>Проект дома №346-1 (166 м²)</h3>
        <p>Вращение: пальцем / Масштаб: сведение</p>
    </div>

    <script>
        // Инициализация 3D сцены
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 18, 22);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.05;

        // Освещение
        scene.add(new THREE.AmbientLight(0xffffff, 0.8));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.7);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        // Материалы
        const floorMat = new THREE.MeshStandardMaterial({ color: 0xc8ad7f, roughness: 0.5 });
        const wallMat = new THREE.MeshStandardMaterial({ color: 0xf4f4f4, roughness: 0.8 });

        // Пол первого этажа
        const baseMesh = new THREE.Mesh(new THREE.BoxGeometry(9.5, 0.2, 11.6), floorMat);
        baseMesh.position.y = -0.1;
        scene.add(baseMesh);

        // Функция постройки стен
        function wall(w, h, d, x, y, z) {
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), wallMat);
            mesh.position.set(x, y, z);
            scene.add(mesh);
        }

        const h = 2.5;
        // Внешний периметр
        wall(9.5, h, 0.2, 0, h/2, -5.8);
        wall(9.5, h, 0.2, 0, h/2, 5.8);
        wall(0.2, h, 11.6, -4.75, h/2, 0);
        wall(0.2, h, 11.6, 4.75, h/2, 0);

        // Внутренние стены
        wall(4.5, h, 0.15, -2.5, h/2, 1.5);
        wall(0.15, h, 4.0, -0.5, h/2, 3.5);
        wall(4.0, h, 0.15, 2.5, h/2, -1.0);

        // Мебель (блоки)
        function prop(w, h, d, x, y, z, color) {
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color, roughness: 0.4 }));
            mesh.position.set(x, y, z);
            scene.add(mesh);
        }

        prop(2.2, 0.7, 0.9, 2.5, 0.35, 4.0, 0x4a6b5b); // Диван
        prop(1.5, 0.75, 0.9, 2.5, 0.37, 1.8, 0x8b5a2b); // Стол
        prop(1.8, 0.8, 0.7, 3.2, 0.4, -4.5, 0xdddddd);   // Кухня
        prop(1.8, 0.5, 2.0, -3.0, 0.25, -4.0, 0x3f51b5); // Кровать

        // Анимация
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
